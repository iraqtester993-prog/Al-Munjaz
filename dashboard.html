<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة تحكم المنجز السريع</title>
<style>
:root{
  --bg:#0F172A; --bg-2:#0B1220; --surface:#16213A; --surface-2:#1D2A47; --border:rgba(255,255,255,.08);
  --ink:#E6EDF7; --ink-soft:#9AA8BF; --ink-faint:#64748B;
  --primary:#22D3EE; --primary-2:#0EA5E9; --success:#34D399; --warning:#FBBF24; --danger:#F87171;
  --st-pending:#FBBF24; --st-approved:#38BDF8; --st-courier:#A78BFA; --st-delivered:#34D399; --st-returned:#F87171;
}
*{margin:0; padding:0; box-sizing:border-box;}
html,body{height:100%;}
body{font-family:'Segoe UI', Tahoma, Arial, sans-serif; background:var(--bg); color:var(--ink); font-size:14px; overflow:hidden;}

/* ---------- LOGIN ---------- */
#loginScreen{position:fixed; inset:0; z-index:100; display:none; align-items:center; justify-content:center; background:radial-gradient(1000px 600px at 20% 10%, rgba(34,211,238,.12), transparent 60%), radial-gradient(800px 500px at 80% 90%, rgba(167,139,250,.12), transparent 60%), var(--bg);}
#loginScreen.active{display:flex;}
.login-box{width:400px; background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:36px 32px; box-shadow:0 30px 60px rgba(0,0,0,.5);}
.login-logo{width:54px; height:54px; border-radius:15px; background:linear-gradient(135deg, var(--primary), var(--primary-2)); display:flex; align-items:center; justify-content:center; margin:0 auto 16px; color:#062033;}
.login-box h1{font-size:19px; text-align:center; font-weight:900; margin-bottom:6px;}
.login-box p{font-size:12px; color:var(--ink-soft); text-align:center; margin-bottom:26px; line-height:1.7;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:11.5px; font-weight:800; color:var(--ink-soft); margin-bottom:6px;}
.field input{width:100%; padding:12px 14px; border:1px solid var(--border); border-radius:11px; background:var(--surface-2); color:var(--ink); font-size:13.5px; outline:none; font-family:inherit; direction:ltr; text-align:left;}
.field input:focus{border-color:var(--primary);}
.login-err{display:none; background:rgba(248,113,113,.12); border:1px solid rgba(248,113,113,.35); color:var(--danger); font-size:12px; font-weight:700; border-radius:10px; padding:10px 12px; margin-bottom:14px; text-align:center;}
.login-err.show{display:block;}
.login-box .btn{width:100%; padding:13px; border:none; border-radius:11px; background:linear-gradient(135deg, var(--primary), var(--primary-2)); color:#062033; font-size:14px; font-weight:900; cursor:pointer; font-family:inherit;}
.login-box .btn:hover{filter:brightness(1.08);}
.login-hint{margin-top:16px; text-align:center; font-size:11px; color:var(--ink-faint);}

/* ---------- SHELL ---------- */
#app{display:none; height:100vh;}
#app.active{display:flex;}
.sidebar{width:242px; flex:none; background:var(--bg-2); border-inline-end:1px solid var(--border); display:flex; flex-direction:column;}
.side-brand{display:flex; align-items:center; gap:10px; padding:20px 18px; border-bottom:1px solid var(--border);}
.side-brand .sb-ico{width:38px; height:38px; border-radius:11px; background:linear-gradient(135deg, var(--primary), var(--primary-2)); display:flex; align-items:center; justify-content:center; color:#062033; flex:none;}
.side-brand b{font-size:14px; font-weight:900;}
.side-brand span{display:block; font-size:10.5px; color:var(--ink-faint); font-weight:700; margin-top:2px;}
.side-nav{flex:1; padding:14px 10px; overflow-y:auto;}
.nav-item{display:flex; align-items:center; gap:11px; padding:11px 13px; border-radius:11px; color:var(--ink-soft); font-weight:800; font-size:13px; cursor:pointer; margin-bottom:4px; transition:background .15s, color .15s;}
.nav-item:hover{background:var(--surface); color:var(--ink);}
.nav-item.active{background:linear-gradient(90deg, rgba(34,211,238,.16), rgba(34,211,238,.04)); color:var(--primary);}
.nav-item .badge{background:var(--danger); color:#fff; font-size:10px; font-weight:900; border-radius:20px; padding:1px 7px; margin-inline-start:auto;}
.side-foot{padding:14px; border-top:1px solid var(--border);}
.side-foot button{width:100%; display:flex; align-items:center; justify-content:center; gap:8px; padding:10px; border-radius:10px; border:1px solid var(--border); background:transparent; color:var(--ink-soft); font-weight:800; font-size:12.5px; cursor:pointer; font-family:inherit;}
.side-foot button:hover{color:var(--danger); border-color:rgba(248,113,113,.4);}

.main{flex:1; display:flex; flex-direction:column; min-width:0;}
.topbar{height:62px; flex:none; display:flex; align-items:center; gap:14px; padding:0 24px; border-bottom:1px solid var(--border); background:var(--bg-2);}
.topbar h2{font-size:16px; font-weight:900;}
.topbar .spacer{flex:1;}
.live-dot{display:flex; align-items:center; gap:6px; font-size:11px; color:var(--ink-soft); font-weight:700;}
.live-dot i{width:8px; height:8px; border-radius:50%; background:var(--success); animation:pulse 1.6s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
.content{flex:1; overflow-y:auto; padding:24px;}
.content::-webkit-scrollbar{width:9px;}
.content::-webkit-scrollbar-thumb{background:var(--surface-2); border-radius:20px;}

/* ---------- CARDS ---------- */
.kpi-grid{display:grid; grid-template-columns:repeat(4, 1fr); gap:16px; margin-bottom:22px;}
.kpi{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:18px; display:flex; align-items:center; gap:14px;}
.kpi .ki{width:46px; height:46px; border-radius:13px; display:flex; align-items:center; justify-content:center; flex:none;}
.kpi .kval{font-size:19px; font-weight:900; letter-spacing:-.2px;}
.kpi .klab{font-size:11px; color:var(--ink-soft); font-weight:700; margin-top:2px;}
.panel{background:var(--surface); border:1px solid var(--border); border-radius:16px; margin-bottom:18px; overflow:hidden;}
.panel-head{display:flex; align-items:center; gap:10px; padding:15px 18px; border-bottom:1px solid var(--border);}
.panel-head h3{font-size:13.5px; font-weight:900; flex:1;}
.panel-body{padding:16px 18px;}
.two-col{display:grid; grid-template-columns:1fr 1fr; gap:18px;}

/* ---------- TABLES ---------- */
table.tbl{width:100%; border-collapse:collapse;}
.tbl th{text-align:right; font-size:11px; font-weight:800; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.4px; padding:10px 12px; border-bottom:1px solid var(--border); white-space:nowrap;}
.tbl td{padding:12px; border-bottom:1px solid var(--border); font-size:12.5px; vertical-align:middle;}
.tbl tr:last-child td{border-bottom:none;}
.tbl tbody tr:hover{background:var(--surface-2);}
.mono{font-family:Consolas, monospace; direction:ltr;}
.chip{display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:800; white-space:nowrap;}
.chip i{width:6px; height:6px; border-radius:50%;}
.src-tag{font-size:10px; font-weight:800; padding:2px 8px; border-radius:6px; background:var(--surface-2); color:var(--ink-soft);}

/* ---------- FILTERS ---------- */
.filter-bar{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; align-items:center;}
.fbtn{padding:8px 16px; border-radius:10px; border:1px solid var(--border); background:var(--surface); color:var(--ink-soft); font-size:12px; font-weight:800; cursor:pointer; font-family:inherit;}
.fbtn.active{background:linear-gradient(135deg, var(--primary), var(--primary-2)); border-color:transparent; color:#062033;}
.fbtn .cnt{opacity:.7; font-size:11px;}
.search{flex:1; min-width:200px; max-width:320px; position:relative;}
.search input{width:100%; padding:9px 14px; border-radius:10px; border:1px solid var(--border); background:var(--surface); color:var(--ink); font-size:12.5px; outline:none; font-family:inherit;}
.search input:focus{border-color:var(--primary);}

/* ---------- CHAT ---------- */
.chat-layout{display:grid; grid-template-columns:320px 1fr; gap:18px; height:calc(100vh - 150px);}
.chat-list{overflow-y:auto; background:var(--surface); border:1px solid var(--border); border-radius:16px;}
.chat-item{display:flex; align-items:center; gap:12px; padding:14px 16px; border-bottom:1px solid var(--border); cursor:pointer;}
.chat-item:hover{background:var(--surface-2);}
.chat-item.active{background:rgba(34,211,238,.08);}
.avatar{width:42px; height:42px; border-radius:50%; background:linear-gradient(135deg, var(--primary), var(--primary-2)); color:#062033; display:flex; align-items:center; justify-content:center; font-weight:900; flex:none;}
.chat-mid{flex:1; min-width:0;}
.chat-mid b{display:block; font-size:13px; font-weight:800;}
.chat-mid span{display:block; font-size:11px; color:var(--ink-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px;}
.chat-end{text-align:left; flex:none;}
.chat-end time{display:block; font-size:10px; color:var(--ink-faint);}
.chat-end .ubadge{display:inline-block; background:var(--danger); color:#fff; font-size:10px; font-weight:900; border-radius:20px; padding:1px 7px; margin-top:4px;}
.chat-thread{display:flex; flex-direction:column; background:var(--surface); border:1px solid var(--border); border-radius:16px; overflow:hidden;}
.thread-head{display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--border);}
.thread-head b{font-size:13.5px; font-weight:900;}
.thread-head .spacer{flex:1;}
.thread-head .src-tag{margin:0;}
.thread-body{flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:10px;}
.bubble{max-width:62%; padding:10px 14px; border-radius:14px; font-size:13px; line-height:1.7; position:relative;}
.bubble-them{background:var(--surface-2); border-bottom-right-radius:4px; align-self:flex-start; border-inline-start:3px solid var(--primary);}
.bubble-me{background:linear-gradient(135deg, var(--primary), var(--primary-2)); color:#062033; font-weight:700; border-bottom-left-radius:4px; align-self:flex-end;}
.bubble time{display:block; font-size:9.5px; opacity:.65; margin-top:4px;}
.chat-empty{display:flex; align-items:center; justify-content:center; color:var(--ink-faint); font-weight:700; font-size:13px;}

/* ---------- STATUS DIST ---------- */
.dist-row{display:flex; align-items:center; gap:12px; margin-bottom:12px;}
.dist-row .dlab{width:88px; font-size:12px; font-weight:800; color:var(--ink-soft);}
.dist-row .dtrack{flex:1; height:9px; border-radius:20px; background:var(--surface-2); overflow:hidden;}
.dist-row .dfill{height:100%; border-radius:20px; transition:width .4s;}
.dist-row .dval{width:46px; text-align:left; font-size:12px; font-weight:900;}

/* ---------- MISC ---------- */
.empty{text-align:center; color:var(--ink-faint); font-weight:700; padding:28px; font-size:12.5px;}
.muted{color:var(--ink-faint); font-size:11px;}
.up{color:var(--success);} .dn{color:var(--danger);}
a{color:var(--primary);}

/* ---------- HERO SLIDER ---------- */
.hero-slider{position:relative; height:200px; border-radius:18px; overflow:hidden; margin-bottom:22px; border:1px solid var(--border);}
.hero-slide{position:absolute; inset:0; opacity:0; transition:opacity .6s ease; display:flex; align-items:center; padding:0 70px 0 28px;}
.hero-slide.active{opacity:1;}
.hero-inner{position:relative; z-index:1;}
.hero-tag{display:inline-flex; align-items:center; gap:6px; width:fit-content; padding:3px 11px; border-radius:20px; font-size:10.5px; font-weight:900; margin-bottom:8px; background:rgba(255,255,255,.16); color:#fff;}
.hero-title{font-size:20px; font-weight:900; color:#fff; margin-bottom:6px; line-height:1.4;}
.hero-sub{font-size:12.5px; color:rgba(255,255,255,.85); font-weight:600; max-width:420px; line-height:1.7;}
.hero-arrow{position:absolute; top:50%; transform:translateY(-50%); width:34px; height:34px; border-radius:50%; background:rgba(255,255,255,.16); color:#fff; border:none; cursor:pointer; font-size:20px; line-height:1; display:flex; align-items:center; justify-content:center; z-index:3; transition:background .2s;}
.hero-arrow:hover{background:rgba(255,255,255,.3);}
.hero-prev{left:14px;}
.hero-next{right:14px;}
.hero-dots{position:absolute; bottom:14px; right:28px; z-index:2; display:flex; gap:6px;}
.hero-dot{width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,.4); cursor:pointer; transition:all .2s;}
.hero-dot.active{width:22px; border-radius:20px; background:#fff;}

/* ---------- NOTIFICATIONS ---------- */
.notif-item{display:flex; gap:14px; padding:15px 18px; border-bottom:1px solid var(--border); align-items:flex-start;}
.notif-item:last-child{border-bottom:none;}
.notif-item.unread{background:rgba(34,211,238,.05);}
.notif-item.unread .notif-body b::before{content:''; display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--danger); margin-inline-end:7px;}
.notif-ic{width:40px; height:40px; border-radius:12px; flex:none; display:flex; align-items:center; justify-content:center;}
.notif-body{flex:1; min-width:0;}
.notif-body b{display:block; font-size:13px; font-weight:900;}
.notif-body span{display:block; font-size:12px; color:var(--ink-soft); margin-top:3px; line-height:1.7;}
.notif-time{flex:none; text-align:left; font-size:10.5px; color:var(--ink-faint); font-weight:700;}

/* ---------- USER CARDS / ROSTER ---------- */
.roster-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:16px;}
.user-card{border:1px solid var(--border); border-radius:16px; background:var(--surface); padding:18px; display:flex; flex-direction:column; gap:14px;}
.user-card:hover{border-color:var(--primary-2);}
.uc-top{display:flex; align-items:center; gap:12px;}
.uc-id{flex:1; min-width:0;}
.uc-id b{display:block; font-size:13.5px; font-weight:900;}
.uc-meta{display:grid; grid-template-columns:1fr 1fr; gap:10px; background:var(--surface-2); border-radius:12px; padding:12px 14px;}
.uc-meta span{display:block; font-size:11.5px; color:var(--ink-soft); font-weight:700;}
.uc-meta label{display:block; font-size:10px; color:var(--ink-faint); font-weight:700; margin-top:2px;}
.uc-stats{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
.uc-stat{text-align:center; background:var(--surface-2); border-radius:10px; padding:10px 4px;}
.uc-stat b{display:block; font-size:14px; font-weight:900;}
.uc-stat span{font-size:9.5px; color:var(--ink-faint); font-weight:700;}
.uc-flag{display:inline-flex; align-items:center; gap:6px; width:fit-content; padding:4px 12px; border-radius:20px; font-size:10.5px; font-weight:900; background:var(--surface-2); color:var(--ink-faint);}
.uc-flag.active{background:rgba(52,211,153,.12); color:var(--success);}
.vtag{padding:3px 10px; border-radius:8px; background:var(--surface-2); color:var(--ink-soft); font-size:10px; font-weight:800; flex:none;}
.user-cell{display:flex; align-items:center; gap:10px;}
.user-cell div{min-width:0;}
.user-cell b{display:block; font-size:12.5px; font-weight:900;}
.fbtn.mini{padding:4px 10px; font-size:10.5px;}
.spacer{flex:1;}
</style>
</head>

function loadData(){
  const raw = readJSON(PLATFORM_KEY);
  let orders, deliveries, merchantTx, courierTx, chats;
  if(raw && typeof raw==='object'){
    orders = Array.isArray(raw.orders)&&raw.orders.length ? raw.orders : seedOrders();
    deliveries = Array.isArray(raw.deliveries)&&raw.deliveries.length ? raw.deliveries : seedDeliveries();
    merchantTx = Array.isArray(raw.merchantTx)&&raw.merchantTx.length ? raw.merchantTx : seedMerchantTx();
    courierTx = Array.isArray(raw.courierTx)&&raw.courierTx.length ? raw.courierTx : seedCourierTx();
    chats = Array.isArray(raw.chats)&&raw.chats.length ? raw.chats : (Array.isArray(raw.merchantChats)&&Array.isArray(raw.courierChats) ? raw.merchantChats.map(c=>Object.assign({src:'merchant'},c)).concat(raw.courierChats.map(c=>Object.assign({src:'courier'},c))) : seedChats());
    users = Array.isArray(raw.users)&&raw.users.length ? raw.users : seedUsers();
    const mh = Array.isArray(raw.merchantHero)&&raw.merchantHero.length ? raw.merchantHero : seedMerchantHero();
    const ch = Array.isArray(raw.courierHero)&&raw.courierHero.length ? raw.courierHero : seedCourierHero();
    heroSlides = mh.map(s=>Object.assign({tag:'merchant', tagLabel:{ar:'تطبيق التاجر',en:'Merchant App'}, grad:'linear-gradient(135deg,#0EA5E9,#22D3EE)'},s)).concat(ch.map(s=>Object.assign({tag:'courier', tagLabel:{ar:'تطبيق المندوب',en:'Courier App'}, grad:'linear-gradient(135deg,#7C3AED,#A78BFA)'},s)));
  } else {
    orders = seedOrders(); deliveries = seedDeliveries(); merchantTx = seedMerchantTx(); courierTx = seedCourierTx(); chats = seedChats(); users = seedUsers();
    heroSlides = seedMerchantHero().map(s=>Object.assign({tag:'merchant', tagLabel:{ar:'تطبيق التاجر',en:'Merchant App'}, grad:'linear-gradient(135deg,#0EA5E9,#22D3EE)'},s)).concat(seedCourierHero().map(s=>Object.assign({tag:'courier', tagLabel:{ar:'تطبيق المندوب',en:'Courier App'}, grad:'linear-gradient(135deg,#7C3AED,#A78BFA)'},s)));
  }
  allOrders = orders.map(o=>Object.assign({src:'merchant'},o)).concat(deliveries.map(d=>Object.assign({src:'courier'},d)));
  if(!Array.isArray(allOrders)) allOrders=[];
  window.__dashChats = chats;
  notifs = readJSON('masar_notifs');
  if(!Array.isArray(notifs)) notifs = seedNotifs();
  buildCourierRoster();
  buildMerchants();
}

function buildCourierRoster(){
  const map = {};
  const init = (key, c)=>{ if(!map[key]) map[key] = Object.assign({name:nm(c.courier||c.courierName||'')||'مندوب', phone:c.phone||'', assigned:0, delivered:0, returned:0, inProgress:0, collected:0, active:false, vehicle:'', address:''}, c); };
  allOrders.forEach(o=>{
    if(o.src==='courier' && o.courier){
      const key=(o.courier||'').toString().replace(/\s/g,'') || (o.courierPhone||'').replace(/\D/g,'');
      init(key, o);
      const s=map[key];
      s.assigned++;
      if(o.status==='delivered') s.delivered++;
      if(o.status==='returned') s.returned++;
      if(o.status==='courier'||o.status==='approved'){ s.inProgress++; s.active=true; }
      if(o.status==='delivered') s.collected += o.price||0;
    }
  });
  allOrders.forEach(o=>{
    if(o.src==='merchant' && o.courier && typeof o.courier==='object'){
      const key=(o.courier.phone||'').replace(/\D/g,'');
      if(!map[key]) map[key]={name:nm(o.courier), phone:o.courier.phone||'', assigned:0, delivered:0, returned:0, inProgress:0, collected:0, active:false, vehicle:'', address:''};
      const s=map[key];
      s.assigned++;
      if(o.status==='delivered') s.delivered++;
      if(o.status==='returned') s.returned++;
      if(o.status==='courier'||o.status==='approved'){ s.inProgress++; s.active=true; }
      if(o.status==='delivered') s.collected += o.price||0;
    }
  });
  users.forEach(u=>{
    if(u.role!=='courier') return;
    const key=(u.phone||'').replace(/\D/g,'') || (u.username||'');
    if(!map[key]) map[key]={name:u.name||u.username, phone:u.phone||'', assigned:0, delivered:0, returned:0, inProgress:0, collected:0, active:false, vehicle:u.vehicle||'', address:u.address||''};
    else { if(u.vehicle) map[key].vehicle=u.vehicle; if(u.address) map[key].address=u.address; if(!map[key].name||map[key].name==='مندوب') map[key].name=u.name; }
  });
  couriers = Object.keys(map).map(k=>map[k]);
}

function buildMerchants(){
  const map = {};
  const init = (key, c)=>{ if(!map[key]) map[key] = Object.assign({name:'', shop:'', phone:'', address:'', orders:0, delivered:0, returned:0, collected:0, active:false}, c); };
  allOrders.forEach(o=>{
    if(o.src!=='courier' || !o.merchant) return;
    const m = o.merchant;
    const key=(m.phone||'').replace(/\D/g,'') || nm(m);
    if(!map[key]) map[key]={name:nm(m), shop:'', phone:m.phone||'', address:nm(m.address)||'', orders:0, delivered:0, returned:0, collected:0, active:false};
    const s=map[key];
    s.orders++;
    if(o.status==='delivered') s.delivered++;
    if(o.status==='returned') s.returned++;
    if(o.status==='delivered') s.collected += o.price||0;
    if(o.status==='pending'||o.status==='approved'||o.status==='courier') s.active=true;
    if(!s.address && m.address) s.address=nm(m.address);
  });
  users.forEach(u=>{
    if(u.role!=='merchant') return;
    const key=(u.phone||'').replace(/\D/g,'') || (u.username||'');
    if(!map[key]) map[key]={name:u.name||u.username, shop:u.shop||'', phone:u.phone||'', address:u.address||'', orders:0, delivered:0, returned:0, collected:0, active:false};
    else {
      if(u.shop) map[key].shop=u.shop;
      if(u.address) map[key].address=u.address;
      if(!map[key].name) map[key].name=u.name;
    }
  });
  merchants = Object.keys(map).map(k=>map[k]);
}

function totals(){
  const t={total:allOrders.length, pending:0, approved:0, courier:0, delivered:0, returned:0, value:0, deliveredValue:0, fees:0, collected:0, budget:0};
  allOrders.forEach(o=>{
    if(ST_LABELS[o.status]!==undefined) t[o.status]++;
    t.value += o.price||0;
    if(o.status==='delivered'){ t.deliveredValue += o.price||0; }
    if(o.fee) t.fees += o.fee;
    if(o.status==='delivered') t.collected += o.price||0;
  });
  t.budget = parseFloat(localStorage.getItem('masar_budget'))||0;
  t.credit = parseFloat(localStorage.getItem('masar_credit'))||0;
  t.merchantsCount = merchants.length;
  t.couriersCount = couriers.length;
  t.unreadNotifs = notifs.filter(n=>!n.read).length;
  return t;
}

      <button class="hero-arrow hero-prev" data-dir="-1">‹</button>
      <button class="hero-arrow hero-next" data-dir="1">›</button>
      <div class="hero-dots">${heroSlides.map((s,i)=>`<span class="hero-dot ${i===0?'active':''}" data-i="${i}"></span>`).join('')}</div>
    </div>`;
}
function initHero(){
  const el = document.getElementById('heroSlider');
  if(!el) return;
  const slides = el.querySelectorAll('.hero-slide');
  const dots = el.querySelectorAll('.hero-dot');
  let cur = 0;
  const show = i=>{
    cur = (i+slides.length)%slides.length;
    slides.forEach((s,j)=>s.classList.toggle('active', j===cur));
    dots.forEach((d,j)=>d.classList.toggle('active', j===cur));
  };
  const auto = setInterval(()=>{ if(document.visibilityState==='visible') show(cur+1); }, 5500);
  el.addEventListener('click', e=>{
    const prev = e.target.closest('[data-dir]');
    const dot = e.target.closest('[data-i]');
    if(prev) show(cur + parseInt(prev.dataset.dir,10));
    else if(dot) show(parseInt(dot.dataset.i,10));
  });
  el._clear = ()=>clearInterval(auto);
}

function handleRecharge(id, action){
  const raw = readJSON(PLATFORM_KEY) || {};
  if(!Array.isArray(raw.rechargeRequests)) return;
  const req = raw.rechargeRequests.find(r => String(r.id)===String(id));
  if(!req) return;
  if(action==='approved'){
    req.status = 'approved';
    const merchants = raw.merchants || [];
    const m = merchants.find(x => String(x.id) === String(req.userId));
    if(m){ m.credit = (m.credit||0) + req.amount; }
    const couriers = raw.couriers || [];
    const c = couriers.find(x => String(x.id) === String(req.userId));
    if(c){ c.credit = (c.credit||0) + req.amount; }
  } else {
    req.status = 'rejected';
  }
  localStorage.setItem(PLATFORM_KEY, JSON.stringify(raw));
  render();
}

function sendDashChat(chatId){
  const input = document.getElementById('dashChatInput');
  if(!input || !input.value.trim()) return;
  const text = input.value.trim();
  const raw = readJSON(PLATFORM_KEY) || {};
  if(!Array.isArray(raw.chats)) raw.chats = [];
  const chat = raw.chats.find(x=>x.id===chatId);
  if(chat){
    const now = new Date();
    const time = now.toLocaleTimeString('ar-IQ',{hour:'2-digit',minute:'2-digit'});
    chat.messages.push({from:'admin', text:{ar:text,ku:text,en:text}, time});
    chat.last = {ar:text,ku:text,en:text};
    chat.time = time;
    localStorage.setItem(PLATFORM_KEY, JSON.stringify(raw));
    activeChat = chatId;
    render();
  }
}

function tryLogin(){

  const saveBtn = e.target.closest('#saveExpiryBtn');

    const v = parseInt(document.getElementById('expiryInput').value,10);
    if(v && v>=1 && v<=1440){
      localStorage.setItem('orderExpiryMinutes', v);
      alert('تم حفظ الإعداد: '+v+' دقيقة');
      render();
    }
    return;
  }
  const preset = e.target.closest('.expiry-preset');
  if(preset){
    const v = parseInt(preset.dataset.v,10);
    localStorage.setItem('orderExpiryMinutes', v);
    render();
    return;
  }
  const savePickupBtn = e.target.closest('#savePickupBtn');
  if(savePickupBtn){
    const v = parseInt(document.getElementById('pickupInput').value,10);
    if(v && v>=5 && v<=120){
      localStorage.setItem('pickupMinutes', v);
      alert('تم حفظ الإعداد: '+v+' دقيقة');
      render();
    }
    return;
  }
  const pickupPreset = e.target.closest('.pickup-preset');
  if(pickupPreset){
    const v = parseInt(pickupPreset.dataset.v,10);
    localStorage.setItem('pickupMinutes', v);
    render();
    return;
  }
  const unhide = e.target.closest('.unhide-btn');
  if(unhide){
    const track = unhide.dataset.track;
    const raw = readJSON(PLATFORM_KEY);
    if(raw && Array.isArray(raw.deliveries)){
      const d = raw.deliveries.find(x=>x.track===track);
      if(d){ d.hidden = false; localStorage.setItem(PLATFORM_KEY, JSON.stringify(raw)); }
    }
    render();
    return;
  }
});
document.getElementById('content').addEventListener('input', (e)=>{
  if(e.target && e.target.id==='ordersSearch'){
    ordersSearch = e.target.value;
    const t = document.getElementById('ordersTable');
    if(t) t.innerHTML = ordersTableHTML(filteredOrders());
  }
});
if(localStorage.getItem(AUTH_KEY)==='1'){
  showApp();
} else {
  showLogin();
}
setInterval(()=>{ if(document.getElementById('app').classList.contains('active')) render(); }, 3000);
</script>
</body>
</html>
